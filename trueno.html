<!doctype html>
<meta charset="utf-8">
<title>Trueno &mdash; physics core</title>
<style>
html,body{margin:0;height:100%;background:#0a0c0e;color:#cfd6db;overflow:hidden;
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
canvas{display:block;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;
  padding:7px 10px;background:rgba(9,11,13,.88);border-bottom:1px solid #23282d;z-index:5}
button{font:inherit;color:#cfd6db;background:#12161a;border:1px solid #262c32;
  border-radius:2px;padding:3px 9px;cursor:pointer}
button:hover{border-color:#3a444c}
button.on{border-color:#4d7f96;color:#8fc3d8}
/* The view selector. Three buttons welded into one control, because they are
   three states of one thing and ought to look like it - a row of independent
   toggles invites you to wonder what happens if you press two. */
#vsel{display:inline-flex;border:1px solid #262c32;border-radius:3px;overflow:hidden}
#vsel button{border:0;border-radius:0;padding:3px 11px;background:#0f1317;
  color:#7e8890;border-left:1px solid #262c32}
#vsel button:first-child{border-left:0}
#vsel button:hover{color:#a9b4bb;background:#141a1f}
#vsel button.on{background:#1b2a33;color:#9fd2e6}
/* Bottom LEFT. Top right is the driving telemetry and bottom right is the
   checklist, and on a narrow window - which is how this gets watched, in a pane
   beside a conversation - anything sharing a corner simply lands on top of what
   is already there. Bottom left is the one corner nothing else wants. */
#cen{position:fixed;left:10px;bottom:10px;width:300px;background:rgba(9,11,13,.9);
  border:1px solid #23282d;border-radius:2px;padding:9px 11px;z-index:5;font-size:11.5px}
#cen h4{margin:0 0 6px;font-size:10.5px;font-weight:400;color:#6c7780;
  letter-spacing:.06em;text-transform:uppercase}
#cen table{border-collapse:collapse;width:100%}
#cen td{padding:1px 0}
#cen td.n{text-align:right;color:#a9b4bb}
#cen tr.big td{padding-top:3px;font-size:13px;color:#cfd6db}
#cen tr.big td.n{color:#8fc3d8}
#tel{position:fixed;right:10px;top:44px;width:300px;background:rgba(9,11,13,.9);
  border:1px solid #23282d;border-radius:2px;padding:9px 11px;z-index:5;font-size:11.5px}
#tel h4{margin:0 0 6px;font-size:10.5px;font-weight:400;color:#6c7780;
  letter-spacing:.06em;text-transform:uppercase}
#tel table{border-collapse:collapse;width:100%}
#tel td{padding:1px 0}
#tel td.n{text-align:right;color:#a9b4bb}
#tests{position:fixed;left:10px;top:44px;bottom:10px;width:430px;overflow:auto;
  background:rgba(9,11,13,.94);border:1px solid #23282d;border-radius:2px;
  padding:9px 11px;z-index:6;font-size:11px;display:none}
#tests.on{display:block}
#tel{max-height:none}
#tests h4{margin:0 0 6px;font-size:10.5px;font-weight:400;color:#6c7780;
  letter-spacing:.06em;text-transform:uppercase}
#tests table{border-collapse:collapse;width:100%}
#tests td{padding:2px 6px 2px 0;vertical-align:top}
#tests td.n{text-align:right;color:#a9b4bb}
.ok{color:#8fbf7a}
.bad{color:#e8927f}
#hint{position:fixed;left:10px;top:44px;color:#5c666e;font-size:11px;z-index:5}
.sp{flex:1}
</style>

<div id="bar">
  <button id="bRun">tests</button>
  <button id="bRays">rays</button>
  <button id="bAuto" class="on">autopilot</button>
  <button id="bGod">god mode</button>
  <span class="sp" style="width:10px"></span>
  <button id="bTime">+2 hours</button>
  <button id="bFast">fast day</button>
  <button id="bRain">rain</button>
  <button id="bPlan">overlays</button>
  <span class="sp" style="width:10px"></span>
  <span id="vsel">
    <button id="vFish" class="on">fishtank</button>
    <button id="vCctv">cctv</button>
    <button id="vTru">trueno</button>
  </span>
  <span class="sp"></span>
  <span id="clock" style="color:#8fc3d8"></span>
  <span class="sp" style="width:10px"></span>
  <span id="stat" style="color:#5c666e"></span>
</div>
<canvas id="cv"></canvas>
<div id="hint">he is driving himself &middot; press <b>autopilot</b> to take over &middot;
  arrows to steer, space for handbrake &middot; <span id="zoomR">wheel to zoom</span>
  &middot; <b>god mode</b> to pick things up</div>
<div id="cen"><h4>who is here &mdash; the census</h4><table id="cenT"></table></div>
<div id="tel"><h4>what he is doing</h4><table id="telT"></table></div>
<div id="tests"><h4>verification &mdash; handover &sect;10</h4><table id="testT"></table></div>
